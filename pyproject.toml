[project]
name = "barnard-motion"
version = "0.1.0"
description = "Offline Gaia DR3 space-motion tutorial for Barnard's Star"
requires-python = "==3.12.*"
dependencies = [
    "astropy==8.0.2",
    "astroquery==0.4.11",
    "fastapi==0.162.7",
    "ipykernel==7.4.0",
    "jupyterlab==4.6.6",
    "matplotlib==3.11.2",
    "nbconvert==7.17.2",
    "numpy==2.5.4",
    "pillow==13.0.0",
    "reproject==0.21.0",
    "scipy==1.18.1",
    "uvicorn==0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
]
