<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPHEREx Blink</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  /* ---------- space background ---------- */
  html { min-height: 100%; background-color: #000; background-attachment: fixed;
         background-image: radial-gradient(ellipse 80% 60% at 70% 20%, #0d0b24 0%, transparent 70%),
                           radial-gradient(ellipse 70% 50% at 15% 85%, #0a1424 0%, transparent 70%); }
  #stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -2; pointer-events: none; }
  .decor { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
  .decor img { position: absolute; height: auto; filter: drop-shadow(0 0 18px rgba(170, 190, 255, .25)); user-select: none; }
  .decor .earth     { width: 270px; left: 3vw;  top: 9vh;     opacity: .9; }
  .decor .saturn    { width: 330px; right: 2vw; top: 44vh;    opacity: .9; }
  .decor .gas-giant { width: 210px; left: 7vw;  bottom: 6vh;  opacity: .85; }
  .decor .nebula    { width: 360px; right: 5vw; top: 2vh;     opacity: .45; }
  .decor .eclipse   { width: 190px; left: 4vw;  top: 50vh;    opacity: .55; }
  .decor .galaxy    { width: 380px; right: 8vw; bottom: 3vh;  opacity: .6; }
  .float { animation: float 7s ease-in-out infinite alternate; will-change: transform; }
  .decor .saturn.float    { animation-duration: 9s;   animation-delay: -3s; }
  .decor .gas-giant.float { animation-duration: 8s;   animation-delay: -5s; }
  @keyframes float { from { transform: translateY(-16px); } to { transform: translateY(16px); } }
  @media (max-width: 1180px) {               /* narrower screens: smaller, dimmer, only the planets */
    .decor .nebula, .decor .eclipse, .decor .galaxy { display: none; }
    .decor .earth { width: 150px; left: -40px; opacity: .45; }
    .decor .saturn { width: 190px; right: -50px; opacity: .45; }
    .decor .gas-giant { width: 120px; left: -30px; opacity: .4; }
  }
  @media (prefers-reduced-motion: reduce) { .float { animation: none; } }

  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #e8eaf4; max-width: 560px;
         margin: 24px auto; padding: 16px 18px 24px; background: rgba(6, 8, 20, .82); border: 1px solid rgba(140, 160, 255, .16);
         border-radius: 14px; box-shadow: 0 0 60px rgba(60, 80, 200, .12); }
  /* no filter/backdrop-filter on body: it would trap the fixed background layers inside the panel */
  @media (max-width: 620px) { body { margin: 0; border-radius: 0; border-left: 0; border-right: 0; padding: 12px 16px 20px; } }
  h2 { margin: 4px 0 14px; font-size: 26px; letter-spacing: .06em; text-transform: uppercase;
       background: linear-gradient(90deg, #fff, #9fb4ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  input, select, button { background: rgba(255, 255, 255, .06); color: #eef; border: 1px solid rgba(160, 175, 255, .28); border-radius: 8px; }
  button { cursor: pointer; }
  button:hover { border-color: rgba(160, 185, 255, .6); }
  option { background: #0b0d1c; }
  input, select, button { padding: 8px; margin: 3px 0; font-size: 16px; max-width: 100%; box-sizing: border-box; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  button.active { background: #2a6; color: #fff; }
  #wrap { position: relative; margin-top: 8px; }
  #frame { width: 100%; background: #000; display: block; image-rendering: pixelated; }
  #flagimg { display: none; position: absolute; left: 0; top: 0; width: 100%; height: 100%; image-rendering: pixelated; pointer-events: none; }
  #flagbox { display: none; position: absolute; left: 45%; top: 45%; width: 10%; height: 10%; background: rgba(255,0,0,.4); pointer-events: none; }
  #marker { display: none; position: absolute; width: 24px; height: 24px; border: 2px solid #0f0; border-radius: 50%; transform: translate(-50%,-50%); pointer-events: none; }
  #measured { display: none; position: absolute; width: 24px; height: 24px; border: 2px dashed #fd0; border-radius: 50%; transform: translate(-50%,-50%); pointer-events: none; }
  #frame-date { margin: 10px 0 4px; font-size: 21px; font-weight: 700; color: #fff; }
  #date-step { color: #bbb; margin-bottom: 6px; }
  #info { margin: 6px 0; font-size: 14px; color: #bbb; }
  #method { margin: 6px 0; font-size: 13px; color: #aaa; }
  #method ul { margin: 4px 0; padding-left: 18px; }
  #aladin { width: 100%; height: 340px; margin: 0 0 12px; border-radius: 6px; overflow: hidden; background: #000; }
  #target-info, #field-center, #frame-quality, #warnings, #method { overflow-wrap: anywhere; }
</style>
<link rel="stylesheet" href="design.css">
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="decor" aria-hidden="true">
  <img class="nebula" src="assets/nebula.png" alt="">
  <img class="galaxy" src="assets/galaxy.png" alt="">
  <img class="eclipse" src="assets/eclipse.png" alt="">
  <img class="earth float" src="assets/earth.png" alt="">
  <img class="saturn float" src="assets/saturn.png" alt="">
  <img class="gas-giant float" src="assets/gas-giant.png" alt="">
</div>
<h2>SPHEREx Blink</h2>
<div id="layout"><div id="col-left">
<p><a style="color:#8fd7ff" href="/challenge-demo/">Five targets · saved GIF gallery</a></p>

<!-- INPUT -->
<div class="row">
  <select id="preset">
    <option value="">Test objects...</option>
    <option value="133.7951,-7.2451">WISE 0855</option>
  </select>
  <input id="target" placeholder="Object name, e.g. Barnard's Star" size="24">
</div>
<div class="row">
  <input id="ra" placeholder="RA (deg or hh:mm:ss)" size="18">
  <input id="dec" placeholder="Dec (deg or dd:mm:ss)" size="18">
</div>
<div class="row">
  <label>Field of view (arcmin) <input id="fov" type="range" min="1" max="20" value="5"></label>
  <label>Detector
    <select id="det"><option>1</option><option>2</option><option>3</option>
    <option>4</option><option>5</option><option>6</option></select>
  </label>
</div>

<label>Image source
  <select id="snapshot"><option value="">Latest IRSA</option><option value="2026-11-15">Saved observations · 15 Nov 2026</option></select>
</label>
<details id="share" hidden><summary>Share or embed this view</summary>
  <label>View URL <input id="share-url" readonly style="width:100%"></label>
  <label>Embed HTML <textarea id="share-html" readonly rows="3" style="width:100%;box-sizing:border-box"></textarea></label>
</details>

<!-- MODES -->
<div class="row" id="modes"></div>

<!-- IMAGE -->
<div id="wrap">
  <img id="frame">
  <img id="flagimg">
  <div id="flagbox"></div>
  <div id="marker"></div>
  <div id="measured"></div>
</div>
<div id="frame-date" role="status"></div>
<div id="date-step"></div>
<!-- PLAYER -->
<div class="row" id="player">
  <button id="prev">← Previous date</button>
  <button id="play">Play</button>
  <button id="next">Next date →</button>
  <label>Speed <input id="speed" type="range" min="100" max="1500" value="600"></label>
</div>
<div id="info" role="status"></div>
<div id="warnings" role="status"></div>
<div id="field-center"></div>
<div id="target-info"></div>
<div id="frame-quality"></div>
<div id="demo-note" hidden>Synthetic demonstration data — not SPHEREx observations.</div>
<details id="method" hidden><summary>How positions are measured</summary><div id="method-body"></div></details>

<div class="row">
  <label><input type="checkbox" id="flags"> Show flags</label>
  <label><input type="checkbox" id="mk"> Show expected position</label>
  <label><input type="checkbox" id="ms"> Show centroid / candidates</label>
</div>

</div><div id="col-right">
<div id="aladin"></div>
<!-- GRAPHS -->
<div class="row">
  <button id="tab-spec" class="active">Spectrum</button>
  <button id="tab-lc">Light curve</button>
</div>
<label><input type="checkbox" id="show-diagnostic-points"> Show preliminary and rejected measurements</label>
<p id="plot-quality" aria-live="polite"></p>
<div id="plot" style="height:300px"></div>
</div></div>
<script>
// ================= DATA LAYER (the only part that changes later) =================
const P = new URLSearchParams(location.search);
const API = P.get("api") || "";
let imageSourceChosen = P.has("snapshot");
// Double-click the file (no ?api=) -> fake data. Any server address -> real data.
const USE_MOCK = P.get("mock") === "1" || (location.protocol === "file:" && !P.get("api"));
document.getElementById("demo-note").hidden = !USE_MOCK;
let lastGrid = null;
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function apiJson(path) {
  const r = await fetch(API + path);
  const d = await r.json();
  if (!r.ok) throw new Error(d.error ? d.error.message : "HTTP " + r.status);
  return d;
}
// Long jobs (/api/spectrum, /api/lightcurve) answer 202 with progress until the result is ready:
// ask the same URL again. Returns null if isCurrent() turns false (the user asked for something else).
async function pollJson(path, isCurrent, onProgress) {
  while (true) {
    if (!isCurrent()) return null;
    const r = await fetch(API + path);
    const d = await r.json();
    if (!isCurrent()) return null;
    if (!r.ok) throw new Error(d.error ? d.error.message : "HTTP " + r.status);
    if (r.status === 202) { onProgress(d); await sleep(2500); continue; }
    if (d.status === "error") throw new Error(d.message);
    return d;
  }
}
// What the graphs are about: a named object (the API then follows its proper motion), else the coordinates.
// One /api/spectrum job serves both graphs; the server chooses 2 exposures per epoch and detector.
function graphQuery() {
  const t = $("target").value.trim(), ra = $("ra").value.trim(), dec = $("dec").value.trim();
  if (Boolean(ra) !== Boolean(dec)) throw new Error("Please enter both RA and Dec coordinates.");
  const q = new URLSearchParams();
  if (ra && dec) { q.set("ra", ra); q.set("dec", dec); }
  else if (t) q.set("target", t);
  else if (lastGrid) { const c = center(); q.set("ra", c.ra); q.set("dec", c.dec); }
  else throw new Error("pick a test object or type a name or RA and Dec");   // nothing chosen yet: no request
  return q;
}
function center() {
  return lastGrid ? {ra: lastGrid.wcs.CRVAL1, dec: lastGrid.wcs.CRVAL2}
                  : {ra: $("ra").value, dec: $("dec").value};
}

function makeFakeFrame(n, total) {
  const c = document.createElement("canvas");
  c.width = c.height = 200;
  const g = c.getContext("2d");
  g.fillStyle = "#000"; g.fillRect(0, 0, 200, 200);
  g.fillStyle = "#fff"; g.fillRect(50, 60, 4, 4); g.fillRect(150, 140, 4, 4);   // fixed stars
  g.fillStyle = "#f55"; g.fillRect(40 + n * (120 / total), 100 + n * 6, 6, 6);  // moving object
  return c.toDataURL();
}

async function getFrames(ra, dec, fov, det, mode, my) {
  if (USE_MOCK) {
    const dates = ["2025-06", "2025-12", "2026-06", "2026-12"];
    return dates.map((d, i) => ({
      url: makeFakeFrame(i, dates.length), date: d,
      expected: [(40 + i * (120 / dates.length) + 3) / 200, (100 + i * 6 + 3) / 200]
    }));
  }
  const q = new URLSearchParams({fov, det, mode});
  if (P.has("max_per_epoch")) q.set("max_per_epoch", P.get("max_per_epoch"));
  const target = $("target").value.trim();
  if (ra !== "" && dec !== "") { q.set("ra", ra); q.set("dec", dec); }
  else if (target) q.set("target", target);
  else throw new Error("Pick a test object or type a name or RA and Dec");
  const snapshot = $("snapshot").value;
  if (snapshot) q.set("snapshot", snapshot);
  // Saved frames belong to this release; a separate live API may be an older build.
  const viewAPI = snapshot ? "" : API;
  const url = `${viewAPI}/api/view?${q}`;

  while (true) {                                   // ask again until the job is ready
    if (my !== reqId) return null;                 // user changed something: stop
    const r = await fetch(url);
    const d = await r.json();
    if (my !== reqId) return null;
    if (!r.ok) throw new Error(d.error ? d.error.message : "HTTP " + r.status);
    if (r.status === 202) {
      $("info").textContent = d.message + (d.total ? ` (${d.done}/${d.total})` : "");
      await sleep(2000);
      continue;
    }
    if (d.status === "error") throw new Error(d.message);
    $("warnings").textContent = (d.warnings || []).join(" ");
    $("field-center").textContent = `Field centre: RA ${d.query.ra.toFixed(6)}°, Dec ${d.query.dec.toFixed(6)}°.` +
      (d.center_mjd != null ? ` Query reference date: MJD UTC ${d.center_mjd.toFixed(5)}.` : " Fixed sky coordinates.");
    const t = d.target_info;
    $("target-info").textContent = t ? `${t.name}: ${t.source}; reference epoch: ${t.ref_epoch ?? "unknown"} ${t.ref_epoch_format || ""} ${t.ref_epoch_scale || "(scale unknown)"}. Model: ${t.coordinate_model}. ${t.limitations || ""} Assumptions: ${(t.assumptions || []).join(", ")}`
      : `Fixed field: RA ${d.query.ra.toFixed(6)}°, Dec ${d.query.dec.toFixed(6)}°. No catalogue tracking.`;
    if (!d.frames.length) throw new Error((d.warnings || []).join(" ") || "No frames for this area");

    const g = d.grid; lastGrid = g;
    // API pixels start at 0, so the pixel centre is x + 0.5; convert to fractions 0..1
    const fr = p => p ? [(p[0] + 0.5) / g.width_px, (p[1] + 0.5) / g.height_px] : null;
    let out = d.frames.map(f => ({
      displayDate: f.date, date: f.mjd_span ? `${f.date} (MJD UTC ${f.mjd_span.join("–")})` : f.date, wavelength: f.wave_um != null ? f.wave_um.toFixed(2) : "", n_exp: f.n_exp,
      url: viewAPI + f.image_url, flagsUrl: f.flags_url ? viewAPI + f.flags_url : null,
      expected: fr(f.predicted_px), measured: fr(f.measured_px),
      candidates: (f.measured_candidates || []).map(c => ({...c, xy: fr(c.xy)})), measurement: f.measurement || null,
      quality: f.quality, predictionStatus: f.prediction_status,
      timeSources: f.time_sources || [], wavelengthSamples: f.wavelength_samples || []
    }));
    showMethod(d.processing);
    if (mode === "trail" && d.trail_url) {
      // one picture with every epoch: residuals coloured by time (blue = first, yellow = last)
      const n = out.length;
      out = [{displayDate: `${out[0].displayDate} → ${out[n - 1].displayDate}`, date: `${out[0].date} → ${out[n - 1].date}`, url: viewAPI + d.trail_url, trail: true, epochs: n}];
    }
    $("info").textContent = "Loading pictures...";
    await Promise.all(out.map(f => new Promise((res, reject) => {   // preload: no flicker while blinking
      const im = new Image(); im.onload = res; im.onerror = () => reject(new Error("An image could not be loaded. Please retry.")); im.src = f.url;
    })));
    if (my !== reqId) return null;
    return out;
  }
}

async function getSpectrum(isCurrent, onProgress) {
  if (!USE_MOCK) return pollJson(`/api/spectrum?${graphQuery()}`, isCurrent, onProgress);
  const wavelength = Array.from({length: 102}, (_, k) => 0.75 + k * (4.25 / 101));
  const flux = wavelength.map(w => 10 + 5 * Math.sin(w * 3) + Math.random());
  return {wavelength, flux};
}

async function getLightCurve(isCurrent, onProgress) {
  if (!USE_MOCK) {
    const q = graphQuery(); q.set("det", $("det").value);
    return pollJson(`/api/lightcurve?${q}`, isCurrent, onProgress);
  }
  return {dates: ["2025-06", "2025-12", "2026-06", "2026-12"], flux: [10, 14, 9, 13]};
}

// ================= STATE =================
const $ = id => document.getElementById(id);
const MODES = ["single", "coadd", "diff", "trail"];
let frames = [], i = 0, timer = null, mode = "coadd", tab = "spec";

// ================= METHOD / QUALITY =================
const esc = t => String(t).replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"})[c]);
function showMethod(pr) {
  if (!pr || !pr.measurement) { $("method").hidden = true; return; }
  const m = pr.measurement, e = pr.epochs || {};
  const li = a => (a || []).map(x => `<li>${esc(x)}</li>`).join("");
  $("method-body").innerHTML =
    `<p>${esc(m.description)}</p>` +
    `<p>Epochs: gap &gt; ${e.gap_days} d starts a new one, each at most ${e.max_span_days} d long.</p>` +
    (pr.background ? `<p>Background: ${esc(pr.background.description)}</p>` : "") +
    (pr.difference ? `<p>Difference: ${esc(pr.difference.description)}</p>` : "") +
    `<p>Limitations:</p><ul>${li(m.limitations)}${li(pr.background && pr.background.limitations)}` +
    `${li(pr.difference && pr.difference.limitations)}</ul>` +
    `<p>Not implemented yet: ${esc((m.not_implemented || []).join(", "))}</p>`;
  $("method").hidden = false;
}
function measuredText(f) {
  const m = f.measurement;
  if (!m) {
    if (f.candidates && !f.measured)
      return f.candidates.length ? `  |  ${f.candidates.length} candidates, no single centre` : "  |  no source found";
    return "";
  }
  if (m.target_association === "far_from_prediction")
    return `  |  candidate ${m.offset_from_prediction_px} px from prediction; target identity unverified`;
  if (m.target_association === "prediction_outside_field")
    return "  |  target prediction outside field; visible sources remain unassociated candidates";
  if (m.quality === "poor") return `  |  candidate only: poor quality (${(m.flags || []).join(", ")})`;
  if (m.status === "ok") {
    const err = m.err_px ? ` ±${Math.max(...m.err_px).toFixed(2)} px` : "";
    const fl = m.flags && m.flags.length ? ` (${m.flags.join(", ")})` : "";
    return `  |  centroid candidate: ${m.quality}${err}${fl}`;
  }
  return `  |  ${m.status === "ambiguous" ? "ambiguous" : "not measured"}: ${m.reason}`;
}

// ================= PLAYER =================
function put(el, p, on) {
  el.style.display = (on && p) ? "block" : "none";
  if (p) { el.style.left = (p[0] * 100) + "%"; el.style.top = (p[1] * 100) + "%"; }
}
function show(n) {
  if (!frames.length) return;
  document.querySelectorAll(".candidate").forEach(el => el.remove());
  i = (n + frames.length) % frames.length;
  const f = frames[i];
  $("frame-date").textContent = `${f.trail ? "Observation dates" : "Observation date"} (UTC): ${f.displayDate || f.date}`;
  $("date-step").textContent = f.trail ? `All ${f.epochs} epochs combined` : `Date ${i + 1} of ${frames.length}`;
  const quality = f.quality;
  const details = ["Source: NASA SPHEREx via NASA/IPAC IRSA.",
    "Violet pixels have no usable data. White fill in masked bright regions is not a flux measurement."];
  const reasonText = {incomplete_pixel_coverage:"some pixels have no usable data",contaminated_pixels:"saturated or contaminated pixels",approximate_wavelength:"wavelength is approximate",invalid_wavelength:"spectral calibration is unavailable here",time_assumptions:"observation time includes assumptions"};
  if (quality) details.push(`Useful pixel coverage: ${(quality.coverage_fraction * 100).toFixed(1)}%. Quality: ${quality.status}; scientific verification: ${quality.verified ? "verified" : "pending"}. ${(quality.reasons || []).map(r=>reasonText[r] || r).join("; ")}`);
  if (f.predictionStatus === "no_model") details.push("No motion prediction for this fixed field.");
  if (f.predictionStatus === "outside_field") details.push("Predicted position is outside this frame; marker hidden.");
  if (f.timeSources?.length) details.push("Time source: " + [...new Set(f.timeSources.map(t => t.source))].join(", ") + ". " + [...new Set(f.timeSources.flatMap(t => t.assumptions || []))].join(", "));
  if (f.wavelengthSamples?.some(s => s.source !== "spectral_wcs")) details.push("Wavelength is approximate; the spectral WCS is unavailable.");
  $("frame-quality").textContent = USE_MOCK ? "Synthetic demonstration data." : details.join(" ");
  $("frame").src = f.url;
  if (f.trail) {                       // trail: a single picture, no per-epoch flags or markers
    $("info").textContent = `All ${f.epochs} epochs on one picture  |  ${f.date}  |  blue = earliest, green = middle, yellow = latest`;
    ["flagimg", "flagbox", "marker", "measured"].forEach(id => $(id).style.display = "none");
    return;
  }
  const wl = f.wavelength ? `  |  ${f.wavelength} µm` : "";
  const ne = f.n_exp ? `  |  ${f.n_exp} exposures` : "";
  const ms = measuredText(f);
  $("info").textContent = `Frame ${i + 1} / ${frames.length}  |  ${f.date}${wl}${ne}  |  mode: ${mode}${ms}`;

  const flagsOn = $("flags").checked;
  if (f.flagsUrl) {                      // real mask picture from the API
    $("flagimg").src = f.flagsUrl;
    $("flagimg").style.display = flagsOn ? "block" : "none";
    $("flagbox").style.display = "none";
  } else {                               // fake red box for the demo
    $("flagimg").style.display = "none";
    $("flagbox").style.display = USE_MOCK && flagsOn ? "block" : "none";
  }
  put($("marker"), f.expected, $("mk").checked);     // green: where the object should be
  if ($("ms").checked && !f.measured) for (const c of f.candidates || []) {
    const el = document.createElement("div"); el.className = "candidate";
    el.style.cssText = "position:absolute;width:18px;height:18px;border:2px dotted orange;transform:translate(-50%,-50%);pointer-events:none";
    $("wrap").appendChild(el); put(el, c.xy, true);
  }
  put($("measured"), f.measured, $("ms").checked);   // yellow dashed: where it was measured
}
function toggle() {
  if (timer) { clearInterval(timer); timer = null; $("play").textContent = "Play"; }
  else { timer = setInterval(() => show(i + 1), +$("speed").value); $("play").textContent = "Pause"; }
}
$("play").onclick = toggle;
$("prev").onclick = () => show(i - 1);
$("next").onclick = () => show(i + 1);
$("speed").oninput = () => { if (timer) { toggle(); toggle(); } };
$("flags").onchange = () => show(i);
$("mk").onchange = () => show(i);
$("ms").onchange = () => show(i);
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;      // don't steal arrows while typing
  if (e.key === "ArrowRight") show(i + 1);
  if (e.key === "ArrowLeft") show(i - 1);
});

// ================= MODES =================
MODES.forEach(m => {
  const b = document.createElement("button");
  b.textContent = m; b.id = "mode-" + m;
  b.onclick = () => { mode = m; highlight(); update(); };
  $("modes").appendChild(b);
});
function highlight() {
  MODES.forEach(m => $("mode-" + m).classList.toggle("active", m === mode));
}

// ================= GRAPHS =================
const layout = (xt, yt) => ({
  xaxis: {title: xt}, yaxis: {title: yt},
  paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)", font: {color: "#eee"}, margin: {t: 20}
});
let plotId = 0;
function plotMessage(text) { if (window.Plotly) Plotly.purge("plot"); $("plot").textContent = text; }
async function drawPlot() {
  const my = ++plotId;                               // a newer graph request cancels this one
  const isCurrent = () => my === plotId;
  const onProgress = d => isCurrent() &&
    plotMessage(`Building the ${tab === "spec" ? "spectrum" : "light curve"}: ${d.message || "working"}` +
                (d.total ? ` (${d.done}/${d.total})` : "") + ". This takes a few minutes the first time.");
  plotMessage("Loading the graph...");
  try {
    const d = tab === "spec" ? await getSpectrum(isCurrent, onProgress) : await getLightCurve(isCurrent, onProgress);
    if (d === null || !isCurrent()) return;
    const x = tab === "spec" ? d.wavelength : d.dates;
    const diagnostics = tab === "spec" ? (d.points || []) : (d.diagnostic_points || []);
    const comparableIds = new Set((d.series || []).flatMap(s => s.obs_ids || []));
    const displayStatus = p => {
      const status = p.validation?.status || "provisional";
      return tab === "lc" && status === "validated" && !comparableIds.has(p.obs_id) ? "provisional" : status;
    };
    const counts = {validated: 0, provisional: 0, rejected: 0};
    diagnostics.forEach(p => { const s = displayStatus(p); counts[s] = (counts[s] || 0) + 1; });
    $("plot-quality").textContent = `Validated: ${counts.validated}. Preliminary: ${counts.provisional}. Rejected: ${counts.rejected}. ` +
      (tab === "lc" ? "Only confirmed matching spectral responses can form a light curve. " : "") + (d.warnings || []).join(" ");
    const showDiagnostics = $("show-diagnostic-points").checked;
    const hasSeries = tab === "lc" && (d.series || []).some(s => s.dates.length);
    const visibleDiagnostics = diagnostics.filter(p => p.flux_ujy != null && p.wave_um != null && Number.isFinite(p.flux_ujy));
    if ((!x || !x.length) && !hasSeries && !(showDiagnostics && visibleDiagnostics.length)) {
      const why = tab === "spec"
        ? "No reliable points are available for this selection."
        : `No reliable points in the window ${(d.wave_window_um || []).join("–")} µm. Try another detector.`;
      plotMessage(why + ((d.warnings || []).length ? " " + d.warnings.join(" ") : ""));
      return;
    }
    const trace = {x, y: d.flux, name: "Validated", mode: tab === "spec" ? "markers" : "lines+markers", type: "scatter",
                   error_y: d.flux_err ? {type: "data", array: d.flux_err, thickness: 1, width: 0} : undefined};
    const traces = hasSeries ? d.series.map((s, i) => ({x:s.dates, y:s.flux, name:`Validated band ${i + 1}`,
      mode:"lines+markers", type:"scatter", error_y:{type:"data", array:s.flux_err}})) : [trace];
    if (showDiagnostics) ["provisional", "rejected"].forEach(status => {
      const pts = visibleDiagnostics.filter(p => displayStatus(p) === status);
      if (!pts.length) return;
      traces.push({x:pts.map(p => tab === "spec" ? p.wave_um : new Date((p.mjd - 40587) * 86400000).toISOString()),
        y:pts.map(p => p.flux_ujy), name:status === "provisional" ? "Preliminary" : "Rejected", mode:"markers", type:"scatter",
        marker:{symbol:status === "rejected" ? "x" : "circle-open", color:status === "rejected" ? "#ee7777" : "#e4b566"},
        text:pts.map(p => `${p.obs_id}: ${(p.quality_reasons || []).join(", ")}${tab === "lc" && p.validation?.status === "validated" && displayStatus(p) !== "validated" ? " spectral comparability unconfirmed" : ""}`), hovertemplate:"%{text}<br>%{y} µJy<extra></extra>"});
    });
    $("plot").textContent = "";
    Plotly.newPlot("plot", traces, tab === "spec" ? layout("Wavelength (µm)", "Flux (µJy)")
                                                   : layout("Date", "Flux (µJy)"),
                   {displayModeBar: false, responsive: true});
  } catch (err) { if (isCurrent()) plotMessage("Could not load the graph: " + err.message); }
}
$("tab-spec").onclick = () => { tab = "spec"; $("tab-spec").classList.add("active"); $("tab-lc").classList.remove("active"); drawPlot(); };
$("tab-lc").onclick   = () => { tab = "lc";   $("tab-lc").classList.add("active"); $("tab-spec").classList.remove("active"); drawPlot(); };
$("show-diagnostic-points").onchange = drawPlot;

// ================= URL SYNC =================
function syncUrl() {
  const p = new URLSearchParams(location.search);   // keeps ?api= and ?mock=
  ["target", "ra", "dec"].forEach(k => $(k).value ? p.set(k, $(k).value) : p.delete(k));
  p.set("fov", $("fov").value); p.set("det", $("det").value); p.set("mode", mode);
  $("snapshot").value ? p.set("snapshot", $("snapshot").value) : p.delete("snapshot");
  history.replaceState(null, "", "?" + p.toString());
  const iframe = document.createElement("iframe");
  iframe.src = location.href;
  iframe.title = "SPHEREx Blink";
  iframe.style.cssText = "width:100%;height:800px;border:0";
  iframe.loading = "lazy";
  $("share-url").value = iframe.src;
  $("share-html").value = iframe.outerHTML;
}
function loadUrl() {
  const p = new URLSearchParams(location.search);
  $("snapshot").value = p.get("snapshot") || "";
  $("target").value = p.get("target") || "";
  $("ra").value = p.get("ra") || "";
  $("dec").value = p.get("dec") || "";
  $("fov").value = p.get("fov") || 5;
  $("det").value = p.get("det") || 3;
  mode = MODES.includes(p.get("mode")) ? p.get("mode") : "coadd";
}

// ================= MAIN UPDATE =================
let reqId = 0;
async function update() {
  document.querySelectorAll(".candidate").forEach(el => el.remove());
  const my = ++reqId;
  ++plotId;
  clearInterval(timer); timer = null; $("play").textContent = "Play";
  frames = []; lastGrid = null;
  $("frame-date").textContent = ""; $("date-step").textContent = "";
  $("frame").removeAttribute("src");
  ["flagimg", "flagbox", "marker", "measured"].forEach(id => $(id).style.display = "none");
  plotMessage("Select Spectrum or Light curve to load a graph.");
  $("warnings").textContent = ""; $("target-info").textContent = "";
  $("field-center").textContent = "";
  $("frame-quality").textContent = "";
  $("method").hidden = true;
  $("share").hidden = true;
  if (!$("target").value.trim() && !$("ra").value.trim() && !$("dec").value.trim() && !USE_MOCK) {
    $("info").textContent = "Enter RA and Dec, an object name, or choose a test object.";
    return;
  }
  syncUrl();
  const ra = $("ra").value.trim(), dec = $("dec").value.trim();
  if (Boolean(ra) !== Boolean(dec)) {
    $("info").textContent = "Please enter both RA and Dec coordinates.";
    plotMessage("Please enter both RA and Dec coordinates.");
    return;
  }
  $("share").hidden = location.protocol === "file:";
  $("info").textContent = "Loading...";
  try {
    const f = await getFrames(ra, dec, $("fov").value, $("det").value, mode, my);
    if (f === null || my !== reqId) return;      // a newer request replaced this one
    frames = f; show(0);
    syncAladin();
  } catch (err) {
    if (my === reqId) $("info").textContent = "Could not load frames: " + err.message;
  }

}
["ra", "dec", "fov", "det"].forEach(id => $(id).onchange = update);
$("snapshot").onchange = () => { imageSourceChosen = true; update(); };
$("target").onchange = () => {
  $("ra").value = ""; $("dec").value = "";
  if (!imageSourceChosen) $("snapshot").value = "";
  update();
};

$("preset").onchange = () => {
  const o = $("preset").selectedOptions[0];
  if (!o.value) return;
  if (o.dataset.fov) {                     // real presets from /api/targets
    $("target").value = o.value; $("ra").value = ""; $("dec").value = "";
    $("fov").value = o.dataset.fov; $("det").value = o.dataset.det;
    if (!imageSourceChosen) $("snapshot").value = "2026-11-15";
  } else {                                 // the demo option with coordinates
    const [ra, dec] = o.value.split(","); $("ra").value = ra; $("dec").value = dec; $("target").value = "";
  }
  update();
};
async function loadPresets() {
  if (USE_MOCK) return;
  try {
    const list = await apiJson("/api/targets");
    $("preset").innerHTML = '<option value="">Test objects...</option>' +
      list.map(t => `<option value="${t.id}" data-fov="${t.fov}" data-det="${t.det}">${t.name}</option>`).join("");
  } catch (e) { console.warn("presets failed", e); }
}

// ================= ALADIN (sky map next to the player) =================
let aladin = null;
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src; s.charset = "utf-8";
    s.onload = res; s.onerror = () => rej(new Error("script failed: " + src));
    document.head.appendChild(s);
  });
}
async function getAladinLib() {
  if (window.A) return window.A;
  try {                                            // first choice: the CDS server (15 second limit)
    await Promise.race([
      loadScript("https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.js"),
      sleep(15000).then(() => { throw new Error("CDS timeout"); })
    ]);
    if (window.A) return window.A;
  } catch (e) { console.warn("Aladin from CDS failed, trying the backup copy", e); }
  const m = await import("https://cdn.jsdelivr.net/npm/aladin-lite@3.8.2/dist/aladin.js");
  return m.default;                                // the backup copy has no global A, it exports it
}
async function initAladin() {
  try {
    const Lib = await getAladinLib();
    await Lib.init;
    aladin = Lib.aladin("#aladin", {survey: "https://irsa.ipac.caltech.edu/data/hips/CDS/DSS2/color", target: "269.452 4.693", fov: 0.15});
    syncAladin();                                  // frames may have loaded before the map was ready
  } catch (e) {
    console.warn("Aladin could not be loaded", e);
    $("aladin").textContent = "Sky map unavailable right now (Aladin Lite could not be loaded).";
  }
}
function syncAladin() {
  if (!aladin || !lastGrid) return;                // demo data has no real sky position
  try {
    const ra = lastGrid.wcs.CRVAL1, dec = lastGrid.wcs.CRVAL2;
    aladin.gotoRaDec(ra, dec);
    const fovDeg = Math.max(0.05, (+$("fov").value / 60) * 1.5);   // arcmin to degrees, a bit wider than the picture
    (aladin.setFoV || aladin.setFov).call(aladin, fovDeg);
  } catch (e) { console.warn("Aladin sync failed", e); }
}
initAladin();
loadPresets(); loadUrl(); highlight(); update();
</script>
<script>
// ================= STARFIELD (decoration only) =================
(() => {
  const c = document.getElementById("stars"), g = c.getContext("2d");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let stars = [], w = 0, h = 0;
  function build() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight; c.width = w * dpr; c.height = h * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
    stars = Array.from({length: Math.round(w * h / 1800)}, () => ({
      x: Math.random() * w, y: Math.random() * h, r: Math.random() ** 3 * 1.4 + 0.25,
      a: 0.25 + Math.random() * 0.75, tw: Math.random() < 0.3 ? 0.6 + Math.random() * 1.6 : 0, ph: Math.random() * 6.28,
      hue: Math.random() < 0.15 ? "200,215,255" : Math.random() < 0.08 ? "255,225,200" : "255,255,255"}));
  }
  function draw(t) {
    g.clearRect(0, 0, w, h);
    for (const s of stars) {
      const a = s.tw ? s.a * (0.55 + 0.45 * Math.sin(s.ph + t / 1000 * s.tw)) : s.a;
      g.fillStyle = `rgba(${s.hue},${a.toFixed(3)})`;
      g.beginPath(); g.arc(s.x, s.y, s.r, 0, 6.2832); g.fill();
    }
    if (!still) requestAnimationFrame(draw);
  }
  build(); draw(0);
  addEventListener("resize", () => { build(); if (still) draw(0); });
})();
</script>
